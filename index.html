<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Todo App</title>
 
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">✦</span>
        <span class="logo-text">TaskFlow</span>
      </div>
      <nav class="header-nav">
        <span class="nav-badge">v2.0</span>
        <span class="nav-date" id="current-date"></span>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-wrap">
    <div class="hero">
      <h1 class="hero-title">Your Tasks,<br><em>Organised.</em></h1>
      <p class="hero-sub">Stay focused. Ship things. Cross them off.</p>
    </div>

    <div class="app-card">
      <!-- Input -->
      <div class="input-row">
        <input type="text" id="todo-input" placeholder="What needs to be done?" maxlength="120" />
        <button id="add-btn" onclick="handleAdd()">
          <span>+</span> Add
        </button>
      </div>

      <!-- Stats bar -->
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-num" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="stat-active">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="stat-done">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>

      <!-- Filter tabs -->
      <div class="filter-tabs">
        <button class="tab active" data-filter="all" onclick="setFilter('all', this)">All</button>
        <button class="tab" data-filter="active" onclick="setFilter('active', this)">Active</button>
        <button class="tab" data-filter="completed" onclick="setFilter('completed', this)">Completed</button>
      </div>

      <!-- Todo List -->
      <ul id="todo-list"></ul>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◎</div>
        <p>No tasks here yet.<br>Add one above!</p>
      </div>

      <!-- Footer actions -->
      <div class="list-footer" id="list-footer" style="display:none">
        <span id="remaining-label"></span>
        <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">✦ TaskFlow</p>
      <p class="footer-copy">Built with HTML, CSS & JS · Stay productive </p>
      <p class="footer-tip">💡 Tip: Click on a task to mark it complete</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
